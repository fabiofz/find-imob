[client]
toolbarMode = "minimal"

[server]
headless = true
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 2
allowedHosts = ["findimob.local", "localhost", "127.0.0.1"]
address = "127.0.0.1"
port = 8502
sslCertFile = ".tls/server.crt"
sslKeyFile = ".tls/server.key"

[theme]
base = "dark"
primaryColor = "#32cb79"
backgroundColor = "#121212"
secondaryBackgroundColor = "#181818"
textColor = "#f5f5f5"
redColor = "#ff1744"
redBackgroundColor = "#a50025"
redTextColor = "#ffffff"

[browser]
serverAddress = "findimob.local"
serverPort = 8501
gatherUsageStats = false
