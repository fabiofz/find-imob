[client]
toolbarMode = "minimal"

[server]
headless = true
runOnSave = true
fileWatcherType = "poll"
enableXsrfProtection = true
enableCORS = true
maxUploadSize = 2

[theme]
base = "dark"
primaryColor = "#32cb79"
backgroundColor = "#121212"
secondaryBackgroundColor = "#181818"
textColor = "#f5f5f5"
redColor = "#ff1744"
redBackgroundColor = "#a50025"
redTextColor = "#ffffff"

[browser]
gatherUsageStats = false
